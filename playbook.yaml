# known to work for almalinux 10

- name: Set up NUC for polymetis
  hosts: nuc
  become: true


  vars:
    robot_ip: "172.16.0.4"

    droid_units:
      - name: polymetis
        exec: micromamba run -r /opt/micromamba -n polymetis-local python /app/scripts/server/run_server.py
        description: "DROID Franka Panda control server"
        cpus: "4-5"

      # the launch_*.sh wrappers read ROBOT_IP from the environment and
      # feed it to both the supervisor's probe and the hydra conf override,
      # so the env var set below is the single knob
      - name: droid-robot
        exec: /app/droid/franka/launch_robot.sh
        description: "DROID Franka Panda arm"
        cpus: "6"

      - name: droid-gripper
        exec: /app/droid/franka/launch_gripper.sh
        description: "DROID Franka Panda gripper"
        cpus: "7"

  tasks:
    - name: Enable the real time repo
      community.general.dnf_config_manager:
        name: rt
        state: enabled

    - name: Make RT the default for future kernel updates
      lineinfile:
        path: /etc/sysconfig/kernel
        regexp: '^DEFAULTKERNEL='
        line: 'DEFAULTKERNEL=kernel-rt-core'

    - name: Install the real time kernel and tuned
      ansible.builtin.dnf:
        name:
          - kernel-rt
          - tuned
          - tuned-profiles-realtime
        state: present
      notify: reboot system

    - name: Run pending reboot handlers now
      ansible.builtin.meta: flush_handlers

    - name: Enable tuned
      service:
        name: tuned
        state: started
        enabled: true

    - name: Check active profile
      command: tuned-adm active
      register: tuned_active
      changed_when: false

    - name: Copy over the tuned configuration file
      ansible.builtin.copy:
        src: realtime-variables.conf
        dest: /etc/tuned/realtime-variables.conf
      register: tuned_variables

    # re-apply the profile when the variables file changed, even if the
    # profile is already active, so a new isolated_cores value reaches
    # the kernel cmdline
    - name: Activate realtime profile
      command: tuned-adm profile realtime
      when: "'realtime' not in tuned_active.stdout or tuned_variables.changed"
      notify: reboot system

    - name: Configure subordinate UIDs for user
      ansible.builtin.lineinfile:
        path: /etc/subuid
        regexp: '^containers:'
        line: "containers:2147483648:1000000"
        create: yes
        mode: '0644'

    - name: Configure subordinate GIDs for user
      ansible.builtin.lineinfile:
        path: /etc/subgid
        regexp: '^containers:'
        line: "containers:2147483648:1000000"
        create: yes
        mode: '0644'

    - name: Install system dependencies
      ansible.builtin.dnf:
        name:
          - git
          - podman
        state: present

    # we need to trust wired interfaces to cope with the unsolicited packets from the controller box
    - name: Find the wired ethernet interfaces
      ansible.builtin.set_fact:
        wired_interfaces: "{{ ansible_facts.interfaces | select('match', '^en') | list }}"

    - name: Check that a wired interface exists
      ansible.builtin.assert:
        that: wired_interfaces | length > 0
        fail_msg: "no en* interface found, cannot open the firewall towards the robot"

    - name: Add the wired interfaces to the trusted firewall zone
      ansible.posix.firewalld:
        zone: trusted
        interface: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ wired_interfaces }}"

    - name: Clone or update Basis' droid fork
      ansible.builtin.git:
        repo: 'https://github.com/BasisResearch/droid'
        dest: '/var/lib/droid'
        single_branch: yes
        version: docker
        recursive: yes
        clone: yes
        update: yes
      register: droid_repo

    - name: Build the image
      containers.podman.podman_image:
        name: polymetis
        path: /var/lib/droid
        # note: if you pulled the repo manually on the NUC, the
        # clone command may return false for the changed flag.
        # in that case, replace the following with force: true
        # to force rebuild. the nice thing is that it won't rebuild
        # everything from scratch, but it might still take a while
        force: "{{ droid_repo.changed }}"
        build:
          file: /var/lib/droid/.docker/nuc/Dockerfile.nuc
      register: polymetis_image

    - name: Configure the container quadlet
      containers.podman.podman_container:
        name: "{{ item.name }}"
        image: localhost/polymetis:latest
        state: quadlet
        network: host
        cap_add:
          - SYS_NICE
        env:
          ROBOT_IP: "{{ robot_ip }}"
        device:
          - /dev/cpu_dma_latency
        cpuset_cpus: "{{ item.cpus }}"
        ulimit:
          - 'rtprio=99'
          - 'memlock=-1:-1'
        userns: auto
        entrypoint: '["/tini", "--"]'
        command: "{{ item.exec }}"
        stop_timeout: 10
        quadlet_options:
          - |
            [Unit]
            Description={{ item.description }}
            Wants=network-online.target
            After=network-online.target
            # note: the infinite retry is bad. so i disabled it and
            # refactored droid side to survive even when the robot is down

            # retry forever, never give up due to start rate limiting
            # StartLimitIntervalSec=0
          - |
            [Service]
            Restart=on-failure
          - |
            [Install]
            WantedBy=multi-user.target

      loop: "{{ droid_units }}"
      register: droid_quadlets


    # only bounce a service when its quadlet or the image actually
    # changed; otherwise just make sure it is running
    - name: Start the polymetis services
      ansible.builtin.systemd_service:
        name: "{{ item.item.name }}.service"
        state: "{{ 'restarted' if (item.changed or polymetis_image.changed) else 'started' }}"
        daemon_reload: true
      loop: "{{ droid_quadlets.results }}"
      loop_control:
        label: "{{ item.item.name }}"

  handlers:
    - name: reboot system
      ansible.builtin.reboot:
