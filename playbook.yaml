# known to work for almalinux 10

- name: Set up NUC for polymetis
  hosts: nuc
  become: true


  vars:
    robot_ip: "172.16.0.4"

    # cpus must stay within the isolated cores (tuned realtime profile,
    # isolated_cores=4-7; CPU 0 is the housekeeping core) and must not
    # overlap between units: isolated cores are not load-balanced, so
    # each unit owns its slice outright. droid-robot runs the 1 kHz
    # libfranka FCI loop and gets the biggest share.
    droid_units:
      - name: polymetis
        exec: micromamba run -r /opt/micromamba -n polymetis-local python /app/scripts/server/run_server.py
        description: "DROID Franka Panda control server"
        cpus: "4-5"

      # the launch_*.sh wrappers read ROBOT_IP from the environment and
      # feed it to both the supervisor's probe and the hydra conf override,
      # so the env var set below is the single knob
      - name: droid-robot
        exec: /app/droid/franka/launch_robot.sh
        description: "DROID Franka Panda arm"
        cpus: "6"

      - name: droid-gripper
        exec: /app/droid/franka/launch_gripper.sh
        description: "DROID Franka Panda gripper"
        cpus: "7"

  tasks:
    - name: Enable the real time repo
      community.general.dnf_config_manager:
        name: rt
        state: enabled

    - name: Install the real time kernel
      ansible.builtin.dnf:
        name:
          - kernel-rt
        state: present

    # note: i've tried automating the realtime kernel
    # as the default but it's quite non-trivial to setup.
    # look up rhel 10 documentation about installing kernels
    # and do that manually

    - name: Run pending reboot handlers now
      ansible.builtin.meta: flush_handlers

    - name: Configure subordinate UIDs for user
      ansible.builtin.lineinfile:
        path: /etc/subuid
        line: "containers:2147483648:1000000"
        create: yes
        mode: '0644'

    - name: Configure subordinate GIDs for user
      ansible.builtin.lineinfile:
        path: /etc/subgid
        line: "containers:2147483648:1000000"
        create: yes
        mode: '0644'

    - name: Install system dependencies
      ansible.builtin.dnf:
        name:
          - git
          - podman
        state: present

    # note: the following configuration is not gonna work
    # because the controller sends an unsolicited packet
    # whose destination part i have not figured out.
    # it's probably the easiest to simply add the ethernet card
    # (not the wireless one) to trusted zone through firewalld
    # - name: Open firewall ports for polymetis
    #   ansible.posix.firewalld:
    #     port: "{{ item }}/tcp"
    #     permanent: true
    #     immediate: true
    #     state: enabled
    #   loop:
    #     - 4242
    #     - 50051
    #     - 50052

    - name: Clone or update Basis' droid fork
      ansible.builtin.git:
        repo: 'https://github.com/BasisResearch/droid'
        dest: '/var/lib/droid'
        single_branch: yes
        version: docker
        recursive: yes
        clone: yes
        update: yes
      register: droid_repo

    - name: Build the image
      containers.podman.podman_image:
        name: polymetis
        path: /var/lib/droid
        # note: if you pulled the repo manually on the NUC, the
        # clone command may return false for the changed flag.
        # in that case, replace the following with force: true
        # to force rebuild. the nice thing is that it won't rebuild
        # everything from scratch, but it might still take a while
        force: "{{ droid_repo.changed }}"
        build:
          file: /var/lib/droid/.docker/nuc/Dockerfile.nuc

    - name: Configure the container quadlet
      containers.podman.podman_container:
        name: "{{ item.name }}"
        image: localhost/polymetis:latest
        state: quadlet
        quadlet_file_mode: '0640'
        network: host
        cap_add:
          - SYS_NICE
        env:
          ROBOT_IP: "{{ robot_ip }}"
        device:
          - /dev/cpu_dma_latency
        cpuset_cpus: "{{ item.cpus }}"
        ulimit:
          - 'rtprio=99'
          - 'memlock=-1:-1'
        userns: auto
        entrypoint: '["/tini", "--"]'
        command: "{{ item.exec }}"
        stop_timeout: 10
        quadlet_options:
          - |
            [Unit]
            Description={{ item.description }}
            Wants=network-online.target
            After=network-online.target
            # note: the infinite retry is bad. so i disabled it and
            # refactored droid side to survive even when the robot is down

            # retry forever, never give up due to start rate limiting
            # StartLimitIntervalSec=0
          - |
            [Service]
            Restart=on-failure
          - |
            [Install]
            WantedBy=multi-user.target

      loop: "{{ droid_units }}"


    - name: Start the polymetis services
      ansible.builtin.systemd_service:
        name: "{{ item.name }}.service"
        state: restarted
        daemon_reload: true
      loop: "{{ droid_units }}"

  # handlers:
